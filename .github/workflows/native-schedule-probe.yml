name: Temporary native schedule diagnostic

'on':
  schedule:
    - cron: '18,23 6 29 10 *'

permissions: {}

jobs:
  observe:
    runs-on: windows-2022
    timeout-minutes: 2
    steps:
      - name: Record the actual scheduler event without keys or repository writes
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -ne 'schedule') { throw 'A real schedule event is required.' }
          $eventData = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          [ordered]@{
            event = $env:GITHUB_EVENT_NAME
            schedule = $eventData.schedule
            run_id = $env:GITHUB_RUN_ID
            runner_environment = $env:RUNNER_ENVIRONMENT
          } | ConvertTo-Json -Compress | Write-Output
